name: Build FlowForge v0.1.2-43

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Verify signing keystore
        run: keytool -list -v -keystore debug.keystore -storetype JKS -storepass android -alias androiddebugkey -keypass androiddebugkey >/dev/null

      - name: Assemble release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify APK is a release-signed build
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: flowforge-release-apk-v0.1.2-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
