name: Build FlowForge v0.2.19
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Verify signing keystore
        run: keytool -list -v -keystore debug.keystore -storetype JKS -storepass android -alias androiddebugkey -keypass androiddebugkey >/dev/null

      - name: Assemble release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify APK is a release-signed build
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Rename APK to FlowForge-vX.X.X.apk
        id: release_name
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | tr -d '\r')
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          ARTIFACT_NAME="FlowForge-v${VERSION_NAME}"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p app/build/outputs/apk/release/renamed
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/renamed/${ARTIFACT_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_name.outputs.artifact_name }}
          path: app/build/outputs/apk/release/renamed/${{ steps.release_name.outputs.artifact_name }}.apk
